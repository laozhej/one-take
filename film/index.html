// ════ THE FILM ══════════════════════════════════════════════════════════════
const C = {

let ADV = 0.6;                                            // monospace advance per px of size, measured once fonts load

  push0: 48.0, push1: 54.0, merge: 54.0, termClick: 54.7, term2: 54.75, title0: 55.75, data0: 57.75,

const PROMPT = "Make a video — and you're the protagonist.";

// ─── desktop geometry (world units = desktop pixels; the camera frames them) ─
const MENU_H = 30;
const DOCK_Y = 1034, ICON = 58;
const DOCK_APPS = ['model', 'code', 'music', 'editor', 'player', 'term'];
const DOCK_X = {}; DOCK_APPS.forEach((a, i) => DOCK_X[a] = 728 + i * 74); DOCK_X.trash = 728 + 6 * 74 + 20;
const HOME_PTR = [1300, 880], HOME_CLAWD = [1370, 922], KICK_SPOT = [1352, 922];

const WIN = {

const C0 = { cx: 960, cy: 540, z: 1, rot: 0 };

const ED = WIN.editor;

// ─── time of day: one day in 64 s, 06:00 → 06:00 ────────────────────────────
// the clock runs 3× faster at night; its speed eases between the two, so light changes at the same rate on both sides of the loop
const nightW = t => { t = mod(t, DURATION); return t < 1 ? 1 - smooth((t + 1) / 2) : t < 47 ? 0 : t < 49 ? smooth((t - 47) / 2) : t < 63 ? 1 : 1 - smooth((t - 63) / 2); };

const darkness = t => { const h = clockHour(t); return Math.min(smooth((h - 19) / 0.45), 1 - smooth((h - 29.05) / 0.4)); };   // auto dark mode, 19:00 → 05:30
const SKY = [
  [0, '#0E1530', '#1E2547'], [4.6, '#131B39', '#2B3260'], [5.4, '#28305A', '#6C5A82'], [6.0, '#4C5C8E', '#F0A57C'],
  [6.8, '#80A3C9', '#F6CFA2'], [8.0, '#9CC3DD', '#F4E6CC'], [12, '#8DBFDF', '#EAF0EA'], [16, '#9DC2DA', '#F3E4C6'],
  [17.3, '#A79FB3', '#F6BE84'], [18, '#5E6496', '#F08A5E'], [18.8, '#2E3864', '#A2617A'], [20, '#151D3B', '#2C3460'], [24, '#0E1530', '#1E2547'],
];

  { base: 912, amp: 30, f: [0.0024, 0.0057], ph: [2.2, 0.7], day: '#B0C29C', night: '#222C47', warm: '#D79C7A' },
  { base: 992, amp: 28, f: [0.0019, 0.0049], ph: [4.1, 3.3], day: '#95AF89', night: '#1A233B', warm: '#C2896C' },

function drawWallpaper(g, t) {

// ─── small drawing helpers ──────────────────────────────────────────────────

// ─── Clawd: the Claude Code banner glyphs ▐▛███▜▌ / ▝▜█████▛▘ / ▘▘ ▝▝ as a 16×10 sprite ──
const PX = 3;
const ACC = ['hat', 'glasses', 'phones', 'beret'];         // modeling, coding, music, editing
function drawClawd(g, p) {
  g.save();

  g.translate(p.x, p.y);

  if (ar < 0) R(15, ar, 1, 2 - ar); else R(15, ar, 2, 2);

    const lifted = c => (p.legs === 1 && (c === 4 || c === 11)) || (p.legs === 2 && (c === 6 || c === 13));
    for (const c of [4, 6, 11, 13]) {
      if (p.legs === 'kick' && c === 4) { R(0, 8, 4, 1); continue; }

  g.beginPath(); R(3, 7, 12, 1); g.fillStyle = 'rgba(90,30,10,0.16)'; g.fill();
  const acc = p.acc;
  if (acc === 'hat') {
    g.beginPath(); R(2, -1, 14, 1); R(4, -2, 10, 1); R(6, -3, 6, 1); g.fillStyle = C.amber; g.fill();
    g.beginPath(); R(4, -1, 10, 1); g.fillStyle = 'rgba(150,80,10,.25)'; g.fill();
  } else if (acc === 'phones') {
    g.beginPath(); R(4, -2, 10, 1); R(3, -1, 1, 1); R(14, -1, 1, 1); R(2, 0, 2, 4); R(14, 0, 2, 4); g.fillStyle = '#2B2522'; g.fill();
  } else if (acc === 'beret') {
    g.beginPath(); R(3, -1, 12, 1); R(4, -2, 11, 1); R(6, -3, 7, 1); R(11, -4, 1, 1); g.fillStyle = C.dusk; g.fill();
  } else if (acc === 'glasses') {
    g.beginPath(); R(3, 1, 12, 1); g.fillStyle = '#2B2522'; g.fill();
    g.beginPath(); R(4, 2, 3, 2); R(11, 2, 3, 2); g.fillStyle = '#DCEBEE'; g.fill();

  g.font = `700 14px ${UI}`; let x = 42 + g.measureText(app).width + 24;
  for (const m of ['File', 'Edit', 'View', 'Window', 'Help']) { txt(g, m, x, 20, `14px ${UI}`, fg); x += g.measureText(m).width + 22; }
  const h = clockHour(t), hh = Math.floor(mod(h, 24)), mm = Math.floor((h - Math.floor(h)) * 60);
  txt(g, `${String(hh).padStart(2, '0')}:${String(mm).padStart(2, '0')}`, W - 22, 20, `600 14px ${MONO}`, fg, 'right');
  g.strokeStyle = fg; g.lineWidth = 1.6; for (let i = 0; i < 3; i++) { g.beginPath(); g.arc(W - 96, 22, 4 + i * 4, -PI * 0.78, -PI * 0.22); g.stroke(); }
  g.strokeStyle = fg; g.lineWidth = 1.2; rr(g, W - 160, 9, 26, 12, 3); g.stroke(); g.fillStyle = fg; g.fillRect(W - 157, 12, 18 * (0.55 + 0.4 * Math.cos(TAU * t / DURATION)), 6); g.fillRect(W - 133, 13, 2, 4);
}

// ─── coaster, reel, dragged clips ───────────────────────────────────────────
function frameXform(g, f) { g.transform(-f.dx, -f.dy, f.dy, -f.dx, f.x, f.y); }
function drawFrameCell(g, j, thumb, sc = 1) {
  g.scale(sc, sc);
  g.fillStyle = '#2B2420'; g.fillRect(-FL / 2 - 0.6, -HW, FL + 1.2, HW * 2);
  g.fillStyle = 'rgba(240,230,210,.9)';
  g.beginPath(); for (const u of [-21, -7, 7, 21]) for (const v of [-19.5, 15.5]) g.rect(u - 3, v, 6, 4); g.fill();
  if (thumb || !THUMBS[j]) { g.fillStyle = mixc('#C9B48E', '#7E9A7B', (j % 7) / 7); g.fillRect(-24, -13.5, 48, 27); }
  else g.drawImage(THUMBS[j], -24, -13.5, 48, 27);
  g.strokeStyle = '#14110F'; g.lineWidth = 0.8; g.strokeRect(-24, -13.5, 48, 27);
}
function drawCoaster(g, t, thumb) {
  if (t < 32.2 || t > T.wind1 + 0.05 || !TRK) return;
  const L = TRK.L, shift = t > T.wind0 ? windShift(t) : 0;
  let built = 0; while (built < NF && FRAME_T[built] <= t) built++;
  const sEnd = t > T.wind0 ? L : Math.min(L, built * FL), sStart = shift;
  if (sEnd - sStart > 4) {                                 // the band itself, so curves read as one continuous strip
    g.strokeStyle = '#2B2420'; g.lineWidth = HW * 2; g.lineJoin = 'round'; g.lineCap = 'butt';
    g.beginPath(); const i0 = Math.ceil(sStart / 2), i1 = Math.min(TRK.X.length - 1, Math.floor(sEnd / 2));
    for (let i = i0; i <= i1; i++) i === i0 ? g.moveTo(TRK.X[i], TRK.Y[i]) : g.lineTo(TRK.X[i], TRK.Y[i]);
    g.stroke();
  }
  for (let j = 0; j < built; j++) {
    const s = (j + 0.5) * FL + shift; if (s > L - 30) continue;
    const f = trackAt(s), pop = clamp((t - FRAME_T[j]) / 0.15);
    g.save(); frameXform(g, f); drawFrameCell(g, j, thumb, j < NFLY ? 1 : easeOutBack(pop)); g.restore();
  }
  for (let j = 0; j < NFLY; j++) {                         // frames still flying out of the RENDER button
    const e = 32.25 + j * 0.125, k = (t - e) / 0.35; if (k < 0 || k >= 1) continue;
    const f = trackAt((j + 0.5) * FL), ang = Math.atan2(-f.dy, -f.dx);
    const O = RENDER_OUT, mx = (O[0] + f.x) / 2, my = Math.min(O[1], f.y) - 120, q = easeOut(k);
    const x = (1 - q) * (1 - q) * O[0] + 2 * (1 - q) * q * mx + q * q * f.x, y = (1 - q) * (1 - q) * O[1] + 2 * (1 - q) * q * my + q * q * f.y;
    let da = ang; while (da > PI) da -= TAU; while (da < -PI) da += TAU;
    g.save(); g.translate(x, y); g.rotate(da * q); drawFrameCell(g, j, thumb, lerp(0.35, 1, q)); g.restore();
  }
  if (t >= 32.9 && t < T.wind0 + 0.1) drawCart(g, t);
}
function drawCart(g, t) {
  const c = cartPos(t), f = c.f, a = smooth((t - 32.9) / 0.25) * (1 - smooth((t - T.wind0) / 0.1));
  const rideT = t >= T.lift0 && t < T.rideEnd, v = rideT ? (rideS(t + 0.02) - rideS(t - 0.02)) / 0.04 : 0, dive = f.dy > 0.25 && v > 300;
  g.save(); g.globalAlpha *= a; g.translate(c.x, c.y); g.transform(-f.dx, -f.dy, f.dy, -f.dx, 0, 0);
  if (t >= 33.75) for (let i = 0; i < 4; i++) {
    const u = [-42, -14, 14, 42][i];
    drawClawd(g, { x: u, y: -2, acc: ACC[i], look: -1, shadow: false, arms: dive ? -2 : 4, armR: dive ? -2 : 4, eyes: dive && i % 2 ? 'closed' : 'open', sy: 1 + (dive ? 0.04 * Math.sin(t * 30 + i) : 0) });
  }
  g.fillStyle = C.clayDark; rr(g, -62, -14, 124, 22, 6); g.fill();
  g.fillStyle = C.clay; rr(g, -62, -14, 124, 7, 4); g.fill();
  g.fillStyle = '#FFF4E8'; g.font = `800 10px ${UI}`; g.textAlign = 'center'; g.fillText('ONE TAKE EXPRESS', 0, 3);
  g.fillStyle = C.ink; for (const u of [-44, 44]) { g.beginPath(); g.arc(u, 10, 6, 0, TAU); g.fill(); }
  g.restore();
}
function drawReel(g, t) {
  const st = reelState(t); if (!st) return;
  g.save(); g.translate(st.x, st.y); g.scale(st.s, st.s);
  g.save(); g.rotate(st.rot);
  g.fillStyle = '#2B2420'; g.beginPath(); g.arc(0, 0, st.r, 0, TAU); g.fill();
  g.fillStyle = '#D9C9AA'; for (let i = 0; i < 3; i++) { const a = i * TAU / 3; g.beginPath(); g.arc(Math.cos(a) * st.r * 0.5, Math.sin(a) * st.r * 0.5, st.r * 0.2, 0, TAU); g.fill(); }
  g.fillStyle = C.clay; g.beginPath(); g.arc(0, 0, st.r * 0.16, 0, TAU); g.fill();
  g.restore();
  if (st.r > 20) txt(g, 'film.mp4', 0, st.r + 18, `700 13px ${MONO}`, '#3A332C', 'center');
  g.restore();
}
const CHIPS = [{ who: 0, label: 'clawd.obj', col: '#7E9A7B', t0: 28.45, t1: T.drop1, from: MODEL_C }, { who: 1, label: 'film.js', col: '#3A332C', t0: 28.6, t1: T.drop2, from: [CO.x + CO.w / 2, CO.y + 240] },
  { who: 2, label: 'score.wav', col: C.amber, t0: 27.95, t1: T.drop3, from: [WV.x + WV.w / 2, WV.y + WV.h / 2] }];
function drawChips(g, t) {
  for (const c of CHIPS) {
    if (t < c.t0 - 0.25 || t > c.t1 + 0.12) continue;
    const st = scriptAt(CLONE[c.who], t), over = [st.x, st.y - 30 - 22];
    let x = over[0], y = over[1], s = 1;
    if (t < c.t0) { const k = easeOut((t - c.t0 + 0.25) / 0.25); x = lerp(c.from[0], over[0], k); y = lerp(c.from[1], over[1], k); s = lerp(1.6, 1, k); }
    if (t > c.t1) { const k = easeIn((t - c.t1) / 0.12); y += k * 40; s = 1 - k * 0.4; }
    g.save(); g.translate(x, y); g.scale(s, s);
    g.shadowColor = 'rgba(40,25,10,.25)'; g.shadowBlur = 8; g.shadowOffsetY = 3;
    g.fillStyle = c.col; rr(g, -56, -14, 112, 28, 7); g.fill(); g.shadowColor = 'transparent';
    txt(g, c.label, 0, 5, `700 13px ${MONO}`, c.who === 2 ? '#4A2E10' : '#FFF8F0', 'center');
    g.restore();
  }
}

// ─── actors and effects ─────────────────────────────────────────────────────
const ZZZ = [63.65, 64.45, 65.25];
function drawZ(g, x, y, s, a) {
  g.save(); g.globalAlpha *= a; g.translate(x, y); g.scale(s, s); g.fillStyle = C.inkSoft;
  g.beginPath(); g.rect(0, 0, 10, 2); g.rect(6, 2, 2, 2); g.rect(4, 4, 2, 2); g.rect(2, 6, 2, 2); g.rect(0, 8, 10, 2); g.fill(); g.restore();
}
function drawActors(g, t) {
  if (t < T.split || t >= T.merge) {
    const p = mainPose(t);
    drawClawd(g, p);
    for (const e of ZZZ) { const age = mod(t - e, DURATION); if (age < 1.8) drawZ(g, HOME_CLAWD[0] + 16 + age * 24 + 4 * Math.sin(age * 5), HOME_CLAWD[1] - 34 - age * 32, 1.2 + age * 0.4, env(age, 0, 0.25, 1.3, 1.8)); }
    return;
  }
  const inCart = t >= 33.75 && t < T.wind0;
  if (!inCart) for (let i = 0; i < 4; i++) drawClawd(g, clonePose(i, t));
}
function ring(g, x, y, k, r0, r1, col, w = 3) {
  if (k <= 0 || k >= 1) return;
  g.save(); g.globalAlpha *= 1 - k; g.strokeStyle = col; g.lineWidth = w * (1 - k) + 0.5; g.beginPath(); g.arc(x, y, lerp(r0, r1, easeOut(k)), 0, TAU); g.stroke(); g.restore();
}
function burst(g, x, y, k, n, r, col, seed) {
  if (k <= 0 || k >= 1) return;
  const R = rng(seed); g.save(); g.fillStyle = col; g.globalAlpha *= 1 - k;
  for (let i = 0; i < n; i++) { const a = R() * TAU, d = r * (0.5 + 0.5 * R()) * easeOut(k), s = 3 + 3 * R(); g.fillRect(x + Math.cos(a) * d - s / 2, y + Math.sin(a) * d - s / 2, s, s); }
  g.restore();
}
function drawFX(g, t) {
  const sp = caretFeet(PROMPT.length);
  ring(g, sp[0], sp[1] - 15, (t - T.split) / 0.4, 10, 90, C.clay, 4); burst(g, sp[0], sp[1] - 15, (t - T.split) / 0.45, 14, 80, C.clay, 5);
  ring(g, MERGE_P[0], MERGE_P[1] - 15, (t - T.merge) / 0.4, 150, 12, C.clayLight, 6); ring(g, MERGE_P[0], MERGE_P[1] - 15, (t - T.merge - 0.08) / 0.5, 10, 120, C.amber, 4);
  burst(g, MERGE_P[0], MERGE_P[1] - 15, (t - T.merge) / 0.6, 22, 110, C.amber, 9);
  ring(g, BTN_C[0], BTN_C[1], (t - T.render) / 0.5, 30, 260, '#FFF4E0', 5);
  ring(g, HOME_PTR[0] + 24, HOME_PTR[1] + 30, (t - T.kick) / 0.3, 4, 40, C.amber, 3); burst(g, HOME_PTR[0] + 24, HOME_PTR[1] + 30, (t - T.kick) / 0.35, 8, 34, C.amber, 3);
  burst(g, TRASH_MOUTH[0], TRASH_MOUTH[1], (t - T.trash) / 0.35, 6, 26, '#B5AA9B', 4);
  burst(g, TRASH_MOUTH[0], TRASH_MOUTH[1], (t - T.popOut) / 0.35, 6, 26, '#B5AA9B', 6);
  const fl = 1 - clamp((t - T.drop) / 0.35);
  if (t >= T.drop && fl > 0) { g.fillStyle = `rgba(255,248,236,${0.75 * fl})`; g.fillRect(PS.x, PS.y, PS.w, PS.h); }
}

// ─── the world, in z-order. part: 0 all · 1 behind the player's screen · 2 in front of it ──
function drawWorld(g, t, cam, part, fill, thumb) {
  setCam(g, cam);
  if (part === 2) { g.save(); g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.restore(); }
  let front = false;
  const on = () => part === 0 || (part === 1 ? !front : front);
  if (on()) drawWallpaper(g, t);
  for (const w of t < 40 ? WIN_EARLY : WINDOWS) {         // the terminal sits behind the four windows it splits into, and in front of the player later
    if (w.id === 'player') { if (on() && isOpen('player', t)) drawWindow(g, w, t, thumb, part === 0 ? fill : null); front = true; }
    else if (on()) drawWindow(g, w, t, thumb, null);
  }
  if (!on()) return;
  drawCoaster(g, t, thumb);
  drawReel(g, t);
  drawChips(g, t);
  drawMenuBar(g, t);
  drawDock(g, t, 0);
  const ps = pointerState(t);
  if (ps.vis) {
    g.save(); if (ps.clip) { g.beginPath(); g.rect(-300, -300, W + 600, TRASH_MOUTH[1] + 300 + 6); g.clip(); }
    drawArrow(g, ps.x, ps.y, ps.rot, ps.s); g.restore();
  }
  drawDock(g, t, 1);
  drawActors(g, t);
  drawFX(g, t);
}

// ─── Droste: the player shows this exact frame, so its screen holds the whole desktop, recursively ──
const bufs = {};
function buf(name) { if (!bufs[name]) { const [c, x] = canvas(W * SS, H * SS); bufs[name] = { c, g: supersample(x, SS) }; } return bufs[name]; }
const needDroste = t => t >= T.drop && t < 60.1 + CLOSE_D;
function droste(t) {
  const back = buf('back'), frontB = buf('front');
  drawWorld(back.g, t, C0, 1, null, false);
  drawWorld(frontB.g, t, C0, 2, null, false);
  const w = WINDOWS.find(x => x.id === 'player'), st = winState(w, t), on = smooth((t - T.drop) / 0.25);
  const rx = st.cx + (PS.x - st.rc[0]) * st.s, ry = st.cy + (PS.y - st.rc[1]) * st.s, rw = PS.w * st.s, rh = PS.h * st.s;
  let src = null;
  for (let i = 0; i < 9; i++) {
    const dst = buf(i % 2 ? 'f2' : 'f1'), g = dst.g;
    g.setTransform(1, 0, 0, 1, 0, 0); g.globalAlpha = 1;
    g.drawImage(back.c, 0, 0, W, H);
    if (src) { g.globalAlpha = on * st.alpha; g.drawImage(src.c, rx, ry, rw, rh); g.globalAlpha = 1; }
    g.drawImage(frontB.c, 0, 0, W, H);
    src = dst;
  }
  return src;
}

// ─── frame ──────────────────────────────────────────────────────────────────
const VIGNETTE = (() => {
  const [c, x] = canvas(W, H);
  const g = x.createRadialGradient(W / 2, H / 2, H * 0.45, W / 2, H / 2, W * 0.72);
  g.addColorStop(0, 'rgba(20,10,0,0)'); g.addColorStop(1, 'rgba(20,10,0,.2)');
  x.fillStyle = g; x.fillRect(0, 0, W, H); return c;
})();
function render(g, t, thumb) {
  const cam = camera(t);
  const F = !thumb && needDroste(t) ? droste(t) : null;
  if (F && isC0(cam)) { g.setTransform(1, 0, 0, 1, 0, 0); g.drawImage(F.c, 0, 0, W, H); }
  else drawWorld(g, t, cam, 0, F ? (gg, x, y, w, h) => gg.drawImage(F.c, x, y, w, h) : null, thumb);
}
let READY = false;
function seek(t) {
  t = clamp(t, 0, DURATION - 1e-6);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over'; ctx.filter = 'none';
  if (!READY) { ctx.fillStyle = '#F4F0E6'; ctx.fillRect(0, 0, W, H); return; }
  render(ctx, t, false);
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1;
  ctx.drawImage(VIGNETTE, 0, 0, W, H);
}

// ─── build everything once, then the film is ready ──────────────────────────
const SHOTS = [{ id: 'one-take', start: 0, end: DURATION, readAt: 9, action: 'one continuous camera move; first frame = last frame' }];
const MARKS = [T.kick, T.enter, T.split, T.march0, T.render, T.lift1, T.drop, T.push0, T.merge, T.title0, T.putBack];
window.__film = { duration: DURATION, ready: false, seek, shots: SHOTS, marks: MARKS, wav: async () => wavB64() };
window.__initLog = [];
const mark = s => window.__initLog.push([s, Math.round(performance.now())]);
(async () => {
  mark('start');
  await Promise.all([document.fonts.load(`16px ${MONO}`, 'Mo'), document.fonts.load(`700 16px ${MONO}`, 'Mo'), document.fonts.load(`16px ${UI}`, 'Aa'), document.fonts.load(`600 16px ${UI}`, 'Aa'), document.fonts.load(`800 16px ${UI}`, 'Aa'),
    document.fonts.load(`600 16px ${UI}`, '→✓▸—·×'), document.fonts.load(`16px ${UI}`, '→✓▸—·×'), document.fonts.load(`800 16px ${UI}`, '→✓▸—·×'),
    document.fonts.load(`16px ${MONO}`, '●⎿·—→✓'), document.fonts.load(`700 16px ${MONO}`, '●⎿·—→✓')]);
  { const [, m] = canvas(8, 8); m.font = `100px ${MONO}`; ADV = m.measureText('MMMMMMMMMM').width / 1000; }
  mark('fonts');
  TRK = buildTrack(TRACK_WP); buildRide(); buildFrames();
  buildScore(); mark('track+score');
  await buildAudio(); mark('audio');
  buildMain(); buildClones(); mark('actors');
  const lines = SRC.split('\n').length, bytes = new TextEncoder().encode(SRC).length;
  STATS = [
    ['duration', '64.000 s', 'frames', '1,920 @ 30 fps'],
    ['shots', '1', 'cuts', '0'],
    ['tempo', '120 BPM', 'bars', '32 · 128 beats'],
    ['score', `${fmt(NOTES.length)} notes`, 'samples', `${fmt(SR * DURATION)} @ 48 kHz`],
    ['source', `${fmt(lines)} lines of JS`, 'size', `${(bytes / 1024).toFixed(1)} KB`],
    ['assets', '0 images', 'audio files', '0'],
  ];
  READY = true;
  const TW = 256, TH = 144;                                // the strip's frames are this film's own frames, rendered small
  THUMBS = [];
  for (let j = 0; j < NF; j++) {
    const [c, x] = canvas(TW, TH), g = supersample(x, TW / W);
    render(g, (j / NF) * DURATION, true);
    THUMBS.push(c);
  }
  mark('thumbs');
  window.__film.ready = true;
  if (!CAPTURE) startEl.textContent = 'click to play · sound on';
})();

// ─── player (not used by the render tools) ──────────────────────────────────
const params = new URLSearchParams(location.search);
const FIXED = params.has('t') ? parseFloat(params.get('t')) : null, CAPTURE = params.has('capture');
const startEl = document.getElementById('start');
let ac = null, play = null;
async function startPlay() {
  if (!window.__film.ready) return;
  if (!ac) ac = new AudioContext();
  await ac.resume();
  if (play?.src) try { play.src.stop(); } catch {}
  const b = ac.createBuffer(2, FOLD[0].length, SR); b.copyToChannel(FOLD[0], 0); b.copyToChannel(FOLD[1], 1);
  const src = ac.createBufferSource(); src.buffer = b; src.loop = true; src.connect(ac.destination);
  const t0 = ac.currentTime + .1; src.start(t0); play = { t0, src };
  startEl.style.display = 'none';
}
startEl.addEventListener('click', startPlay);
cv.addEventListener('click', () => ac && (ac.state === 'running' ? ac.suspend() : ac.resume()));
addEventListener('keydown', e => {
  if (e.key === ' ' && ac) { e.preventDefault(); ac.state === 'running' ? ac.suspend() : ac.resume(); }
  if (e.key.toLowerCase() === 'f') document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen();
});
function frame() {
  const t = FIXED !== null ? FIXED : play ? mod(ac.currentTime - play.t0, DURATION) : (performance.now() / 1000) % DURATION;
  seek(Math.max(0, t));
  requestAnimationFrame(frame);
}
if (FIXED !== null || CAPTURE) startEl.remove();
if (!CAPTURE) requestAnimationFrame(frame);
</script>
